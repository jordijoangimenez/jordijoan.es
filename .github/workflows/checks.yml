name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Pages match their templates
        shell: pwsh
        run: ./build.ps1 -Check

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the accessibility checker
        run: npm install --no-save --no-audit --no-fund puppeteer@23.11.1 axe-core@4.10.2 http-server@14.1.1

      - name: Accessibility check (axe-core on every page, both themes)
        run: |
          npx http-server -p 8080 -s . &
          sleep 2
          node .github/a11y-check.mjs
