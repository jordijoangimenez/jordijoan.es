name: Update Electómetro data

on:
  schedule:
    # every day at 05:30 UTC (after Electográfica's evening posts, before the Spanish morning)
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-electometro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hobbylab/electometro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch new posts and rebuild the data
        run: node scripts/update.mjs
      - name: Commit changed data
        working-directory: .
        run: |
          git config user.name "electometro-update[bot]"
          git config user.email "electometro-update@users.noreply.github.com"
          git add hobbylab/electometro/data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Electómetro: update poll data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi