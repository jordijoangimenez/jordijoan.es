name: Update Primómetro data

on:
  schedule:
    # every day at 06:10 UTC; ECB rates are daily, bond yields monthly
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-primometro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch from the ECB Data Portal
        working-directory: hobbylab/primometro
        run: node scripts/fetch.mjs
      - name: Commit changed data
        run: |
          git config user.name "primometro-update[bot]"
          git config user.email "primometro-update@users.noreply.github.com"
          git add hobbylab/primometro/data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Primómetro: update ECB data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
